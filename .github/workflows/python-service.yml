name: Python Service CI/CD

on:
  push:
    branches: [main]
    paths: ['python-service/**']
  pull_request:
    branches: [main]
    paths: ['python-service/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://meridian:meridian@localhost:5432/meridian

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check app/
      - run: uv run alembic upgrade head
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    env:
      GIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        env:
          ACR_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          docker build -t "$ACR_SERVER/meridian-python:$GIT_SHA" python-service/
          docker push "$ACR_SERVER/meridian-python:$GIT_SHA"

      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: meridian-python
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/meridian-python:${{ github.sha }}
